name: Recoup
options:
  bundleIdPrefix: com.marketingbull
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.marketingbull.recoup
    PRODUCT_NAME: Recoup
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Apple Developer team ID (Xcode → Settings → Accounts). Swap to your
    # Marketing Bull org team if you ship under that instead of personal.
    DEVELOPMENT_TEAM: V9GS2JE8BP
    # XcodeGen generates the Info.plist from the target's `info` block below
    # (source of truth stays in this file), so Xcode's own generation is off.
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Recoup:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Recoup
    info:
      path: Recoup/Support/Info.plist
      properties:
        CFBundleDisplayName: Recoup
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.finance
        # Declares no non-exempt encryption — skips the export-compliance
        # prompt on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Recoup uses the camera to photograph expense receipts.
        # Empty launch screen → full-screen rendering on modern iPhones/iPads.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Recoup/Support/Recoup-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Recoup/Support/Recoup-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Recoup/Support/Recoup-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES

schemes:
  Recoup:
    build:
      targets:
        Recoup: all
    run:
      config: Debug
    archive:
      config: Release
