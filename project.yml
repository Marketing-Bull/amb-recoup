name: Recoup
options:
  bundleIdPrefix: com.marketingbull
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.marketingbull.recoup
    PRODUCT_NAME: Recoup
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set to your 10-character Apple Developer team ID (Xcode → Settings → Accounts)
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_KEY_CFBundleDisplayName: Recoup
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance

targets:
  Recoup:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Recoup
    settings:
      base:
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Recoup/Support/Recoup-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Recoup/Support/Recoup-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Recoup/Support/Recoup-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Recoup uses the camera to photograph expense receipts."

schemes:
  Recoup:
    build:
      targets:
        Recoup: all
    run:
      config: Debug
    archive:
      config: Release
